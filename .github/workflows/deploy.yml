name: Deploy Node App via Cloudflare Tunnel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install Cloudflared CLI
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Execute Remote SSH Deployment
        run: |
              ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              ${{ secrets.SERVER_USER }}@${{ secrets.SSH_HOST }} \
              "cd /var/www/my-node-app && echo 'YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}' > .env && cd backend && git fetch --all && git reset --hard origin/main && npm install && pm2 restart szentharomsag-api"
